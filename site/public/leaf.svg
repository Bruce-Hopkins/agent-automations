<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Leaf made of linked agents">
  <title>Leaf agent graph logo</title>
  <defs>
    <linearGradient id="leaf" gradientUnits="userSpaceOnUse" x1="112" y1="469" x2="404" y2="41">
      <stop offset="0" stop-color="#3B17FF"/>
      <stop offset="1" stop-color="#00FDBA"/>
    </linearGradient>
    <!-- The agent graph is cut out of the leaf: the background shows through -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="-200" y="-200" width="900" height="900">
      <rect x="-200" y="-200" width="900" height="900" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
        <path d="M222 362 C240 332 258 298 272 266 C284 240 292 224 298 212"/>
        <path d="M222 362 C262 342 300 330 336 314"/>
        <path d="M222 362 C212 340 196 318 178 292"/>
        <path d="M222 362 C200 388 176 414 150 440"/>
      </g>
    </mask>
  </defs>

  <g transform="translate(256 256) scale(1.0629) translate(-259.5 -255.5)">
    <path mask="url(#cut)" fill="url(#leaf)" stroke="url(#leaf)" stroke-width="10" stroke-linejoin="round" d="M341 46 C380 72 398 130 399 200 C400 270 392 330 372 380 C352 430 310 462 262 464 C220 466 178 446 150 410 C122 374 112 320 124 280 C136 240 160 222 200 204 C250 182 285 150 313 106 C326 86 334 66 341 46Z"/>
  </g>
</svg>
